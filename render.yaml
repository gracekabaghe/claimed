services:
  - type: web
    name: claimed
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: SECRET_KEY
        generateValue: true